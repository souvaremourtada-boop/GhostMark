<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GhostMark Verifier</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 320px;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0D1F3C;
    color: #E2EAF4;
  }
  header {
    background: #0D1F3C;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid #0891B2;
  }
  .logo-text { font-size: 16px; font-weight: 700; color: #00D4FF; letter-spacing: -0.5px; }
  .logo-sub  { font-size: 10px; color: #6B84A3; }

  .body { padding: 16px; background: #0C1829; }

  .upload-zone {
    border: 2px dashed rgba(0,212,255,0.3);
    border-radius: 6px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 12px;
  }
  .upload-zone:hover { border-color: #00D4FF; background: rgba(0,212,255,0.05); }
  .upload-zone p { font-size: 12px; color: #6B84A3; margin-top: 8px; }
  .upload-zone strong { color: #00D4FF; }
  input[type="file"] { display: none; }

  .btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 8px;
    transition: all 0.2s;
  }
  .btn-primary { background: #00D4FF; color: #0D1F3C; }
  .btn-primary:hover { background: #33DEFF; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .result {
    display: none;
    margin-top: 12px;
    padding: 12px;
    border-radius: 6px;
    font-size: 12px;
  }
  .result.ok   { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); }
  .result.fail { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3);  }
  .result-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .result-title.ok   { color: #10B981; }
  .result-title.fail { color: #EF4444; }
  .result-row { color: #6B84A3; margin-bottom: 4px; }
  .result-row span { color: #E2EAF4; }

  .log {
    background: #050B14;
    border-radius: 4px;
    padding: 8px;
    font-family: monospace;
    font-size: 10px;
    max-height: 80px;
    overflow-y: auto;
    margin-top: 8px;
    color: #10B981;
  }

  footer {
    padding: 8px 16px;
    text-align: center;
    font-size: 10px;
    color: #6B84A3;
    background: #0D1F3C;
    border-top: 1px solid rgba(0,212,255,0.1);
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo-text">GhostMark</div>
    <div class="logo-sub">Vérificateur de Documents</div>
  </div>
</header>

<div class="body">
  <div class="upload-zone" onclick="document.getElementById('docInput').click()">
    <input type="file" id="docInput" accept="image/*,.pdf" onchange="handleFile(event)">
    <div style="font-size:28px;">📄</div>
    <p><strong>Cliquez</strong> pour charger un document<br>Image ou PDF certifié GhostMark</p>
  </div>

  <button class="btn btn-primary" id="verifyBtn" onclick="verifyDoc()" disabled>
    🔍 Vérifier l'Authenticité
  </button>

  <div class="result" id="resultOk">
    <div class="result-title ok">✅ Document Authentique</div>
    <div class="result-row">Émetteur : <span id="rCreator">—</span></div>
    <div class="result-row">Date : <span id="rDate">—</span></div>
    <div class="result-row">Hash : <span id="rHash">—</span></div>
  </div>

  <div class="result" id="resultFail">
    <div class="result-title fail">❌ Document Non Certifié</div>
    <div class="result-row" id="rError">Aucun watermark GhostMark détecté.</div>
  </div>

  <div class="log" id="logBox"></div>
</div>

<footer>iSAFE Hackathon 2026 — SMSI / AI for Good</footer>

<script src="../core/dct.js"></script>
<script src="../core/hash.js"></script>
<script src="../core/watermark.js"></script>
<script src="../core/zone-analyzer.js"></script>
<script src="popup.js"></script>
</body>
</html>
